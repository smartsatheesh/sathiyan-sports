<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Coach WhatsApp Notifications - Sathiyan Sports</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 1rem;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
        }
        .success {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }
        .loading {
            text-align: center;
            color: #667eea;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Test Coach WhatsApp Notifications</h1>
        
        <div class="info">
            <strong>📱 WhatsApp Integration Test</strong><br>
            This tool tests The Coach AI system's ability to send personalized training plans via WhatsApp.
            Enter a phone number (with country code) to receive a sample training plan notification.
        </div>

        <form id="testForm">
            <div class="form-group">
                <label for="phoneNumber">📱 Phone Number (with country code)</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" 
                       placeholder="e.g., 919787020525" required
                       pattern="[0-9]{10,15}">
                <small style="color: #6b7280;">Include country code (e.g., 91 for India)</small>
            </div>

            <div class="form-group">
                <label for="playerName">👤 Player Name (optional)</label>
                <input type="text" id="playerName" name="playerName" 
                       placeholder="e.g., John Doe">
            </div>

            <div class="form-group">
                <label for="sport">🏸 Sport (optional)</label>
                <input type="text" id="sport" name="sport" 
                       placeholder="e.g., Badminton, Football, Tennis">
            </div>

            <button type="submit" id="submitBtn">
                📱 Send Test Training Plan
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            const formData = new FormData(e.target);
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/test-coach-whatsapp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phoneNumber: formData.get('phoneNumber'),
                        testPlan: {
                            overview: `🎯 Personalized training plan for ${formData.get('playerName') || 'Athlete'} in ${formData.get('sport') || 'Sports'}`,
                            weekly_schedule: {
                                Monday: "Foundation & Strength Building",
                                Tuesday: "Skill Development & Technique",
                                Wednesday: "Cardio & Endurance Training",
                                Thursday: "Power & Agility Work",
                                Friday: "Sport-Specific Practice",
                                Saturday: "Active Recovery & Mobility",
                                Sunday: "Rest & Mental Preparation"
                            },
                            nutrition_tips: [
                                "Pre-workout: Banana + coffee 30 mins before",
                                "Post-workout: Protein shake within 30 minutes",
                                "Hydration: 3-4 liters of water throughout the day",
                                "Recovery: Include anti-inflammatory foods like berries"
                            ]
                        }
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        Test training plan sent to WhatsApp successfully!<br>
                        <small>Method: ${data.method?.toUpperCase() || 'Unknown'} | Time: ${new Date(data.timestamp).toLocaleTimeString()}</small>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to send notification');
                }
                
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `
                    <strong>❌ Error!</strong><br>
                    ${error.message}<br>
                    <small>Please check the console for more details.</small>
                `;
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '📱 Send Test Training Plan';
                result.style.display = 'block';
            }
        });

        // Auto-fill with default values for testing
        document.getElementById('phoneNumber').value = '919787020525';
        document.getElementById('playerName').value = 'Test Player';
        document.getElementById('sport').value = 'Badminton';
    </script>
</body>
</html>
