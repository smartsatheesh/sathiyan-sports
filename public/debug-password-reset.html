<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Debug - Sathiyan Sports</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #2d5aa0; text-align: center; }
        .test-section {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-section.whatsapp { border-color: #25d366; background: #f8fff8; }
        .test-section.email { border-color: #1976d2; background: #f8f9ff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-email { background: #1976d2; color: white; }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }
        .result.success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .result.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Password Reset Debug Tool</h1>
        <p style="text-align: center; color: #666;">Test both WhatsApp and Email password reset methods</p>

        <div class="test-section whatsapp">
            <h3>📱 WhatsApp/Mobile Reset Test</h3>
            <p>Uses: <code>/api/auth/forgot-password-otp</code></p>
            
            <div class="form-group">
                <label for="mobile">Mobile Number (10 digits):</label>
                <input type="text" id="mobile" value="9787020525" placeholder="9876543210">
            </div>
            
            <button class="btn btn-whatsapp" onclick="testWhatsAppReset()">📱 Test WhatsApp Reset</button>
            <button class="btn btn-whatsapp" onclick="checkWhatsAppStatus()">📊 Check WhatsApp Status</button>
            
            <div id="whatsapp-result"></div>
        </div>

        <div class="test-section email">
            <h3>📧 Email Reset Test</h3>
            <p>Uses: <code>/api/auth/forgot-password</code></p>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" value="smartsatheesh16@gmail.com" placeholder="user@example.com">
            </div>
            
            <button class="btn btn-email" onclick="testEmailReset()">📧 Test Email Reset</button>
            <button class="btn btn-email" onclick="checkEmailConfig()">⚙️ Check Email Config</button>
            
            <div id="email-result"></div>
        </div>

        <div class="test-section">
            <h3>🧪 System Status</h3>
            <button class="btn" style="background: #666; color: white;" onclick="checkOverallStatus()">📊 Check All Systems</button>
            <div id="status-result"></div>
        </div>
    </div>

    <script>
        async function testWhatsAppReset() {
            const mobile = document.getElementById('mobile').value;
            const resultDiv = document.getElementById('whatsapp-result');
            
            if (!mobile || mobile.length !== 10) {
                resultDiv.innerHTML = '<div class="result error">❌ Please enter a valid 10-digit mobile number</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="result">⏳ Testing WhatsApp reset...</div>';

            try {
                const response = await fetch('/api/auth/forgot-password-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile })
                });

                const data = await response.json();
                
                let message = `Status: ${response.status}\n`;
                message += `Success: ${data.success}\n`;
                message += `Message: ${data.message}\n`;
                message += `Method: ${data.method || 'N/A'}\n`;
                
                if (data.whatsappUrl) {
                    message += `WhatsApp URL: ${data.whatsappUrl}\n`;
                }
                
                message += `Response: ${JSON.stringify(data, null, 2)}`;
                
                const className = data.success ? 'success' : 'error';
                resultDiv.innerHTML = `<div class="result ${className}">${message}</div>`;
                
                if (data.whatsappUrl) {
                    const linkDiv = document.createElement('div');
                    linkDiv.innerHTML = `
                        <div style="margin-top: 10px; padding: 10px; background: #e8f5e8; border-radius: 4px;">
                            <a href="${data.whatsappUrl}" target="_blank" style="color: #25d366; font-weight: bold;">
                                📱 Click to send WhatsApp message
                            </a>
                        </div>
                    `;
                    resultDiv.appendChild(linkDiv);
                }

            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testEmailReset() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('email-result');
            
            if (!email || !email.includes('@')) {
                resultDiv.innerHTML = '<div class="result error">❌ Please enter a valid email address</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="result">⏳ Testing email reset...</div>';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                
                let message = `Status: ${response.status}\n`;
                message += `Success: ${data.success}\n`;
                message += `Message: ${data.message}\n`;
                message += `Response: ${JSON.stringify(data, null, 2)}`;
                
                const className = response.ok ? 'success' : 'error';
                resultDiv.innerHTML = `<div class="result ${className}">${message}</div>`;

            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function checkWhatsAppStatus() {
            const resultDiv = document.getElementById('whatsapp-result');
            resultDiv.innerHTML = '<div class="result">⏳ Checking WhatsApp status...</div>';

            try {
                const response = await fetch('/api/test-whatsapp-alternatives');
                const data = await response.json();
                
                let message = 'WhatsApp Integration Status:\n';
                message += `Current Method: ${data.status?.currentMethod || 'Unknown'}\n`;
                message += `Available Methods: ${JSON.stringify(data.status?.available || {})}\n`;
                message += `Service Status: ${JSON.stringify(data.status?.service || {})}\n`;
                
                resultDiv.innerHTML = `<div class="result success">${message}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error checking status: ${error.message}</div>`;
            }
        }

        async function checkEmailConfig() {
            const resultDiv = document.getElementById('email-result');
            const message = `Email Configuration Check:
            
EMAIL_SERVER_HOST: ${document.location.hostname === 'localhost' ? 'Not configured (development)' : 'Check server'}
EMAIL_SERVER_USER: Not configured
EMAIL_SERVER_PASSWORD: Not configured

This means:
✅ Email requests will be logged to server console
✅ No actual emails will be sent (development mode)
✅ Check server terminal for email content

To enable actual email sending, configure SMTP settings in .env.local`;
            
            resultDiv.innerHTML = `<div class="result success">${message}</div>`;
        }

        async function checkOverallStatus() {
            const resultDiv = document.getElementById('status-result');
            resultDiv.innerHTML = '<div class="result">⏳ Checking all systems...</div>';

            let message = `System Status Report:
            
🌐 Server: ${document.location.href}
📱 WhatsApp Method: Simple (Console + URLs)
📧 Email Method: Console logging (development)
⚙️ Environment: Development

Current Setup:
✅ WhatsApp: Uses unified service with fallback
✅ Email: Logs to console when SMTP not configured  
✅ OTP Service: Working with global storage
✅ Database: MongoDB Atlas connected

Recommendations:
1. Use WhatsApp method for immediate testing
2. Check server console for all notifications
3. Click generated WhatsApp URLs for manual sending
4. Configure SMTP for production email sending`;
            
            resultDiv.innerHTML = `<div class="result success">${message}</div>`;
        }

        // Auto-check status on page load
        setTimeout(checkOverallStatus, 1000);
    </script>
</body>
</html>
