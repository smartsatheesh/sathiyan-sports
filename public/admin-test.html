<!DOCTYPE html>
<html>
<head>
    <title>Admin Subscriptions Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; margin: 10px; display: inline-block; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Admin Subscriptions Navigation Test</h1>
    <p>Click the button below to test the admin subscriptions page:</p>
    
    <a href="http://localhost:3000/admin" class="test-btn">Go to Admin Dashboard</a>
    <a href="http://localhost:3000/admin/subscriptions" class="test-btn">Go to Admin Subscriptions (Direct)</a>
    <a href="http://localhost:3000/subscription" class="test-btn">Go to Old Subscription Page</a>
    
    <script>
        console.log('Admin test page loaded');
        
        // Test if we can access admin subscriptions
        setTimeout(() => {
            fetch('/admin/subscriptions')
                .then(response => {
                    console.log('Admin subscriptions page status:', response.status);
                })
                .catch(error => {
                    console.error('Error accessing admin subscriptions:', error);
                });
        }, 1000);
    </script>
</body>
</html>
